
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
  phpmyadmin:
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
